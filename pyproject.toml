[project]
name = "lowenstein-viewer"
version = "0.1.0"
description = "Self-hosted Lowenstein Prisma CPAP data viewer"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "python-multipart==0.0.19",
    "defusedxml==0.7.1",
    "prometheus-client==0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
